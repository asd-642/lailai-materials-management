    <main aria-labelledby="recovery-title">
      <h1 id="recovery-title">來來建材報價與材料管理系統</h1>
      <p class="hint">重設 Supabase 帳號密碼</p>
      <p class="hint">這裡可寄送 Supabase 帳號密碼重設信或更新密碼，不會變更網站內部管理員 PIN，也不會啟動資料同步。</p>
